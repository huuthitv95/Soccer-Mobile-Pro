<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourEventConfig Editor</title>
<style>
  :root {
    --bg: #f5f6f3;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --line: #dfe3e6;
    --line-strong: #b8c0c7;
    --text: #1f2933;
    --muted: #66737f;
    --accent: #1f7a5a;
    --accent-weak: #e5f3ed;
    --danger: #b23b3b;
    --danger-weak: #fdeaea;
    --warn: #9a6a12;
    --warn-weak: #fff2cf;
    --info: #2f5e9e;
    --info-weak: #e8f0fb;
    --shadow: 0 10px 24px rgba(20, 28, 34, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    font-size: 14px;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    min-height: 34px;
    padding: 7px 12px;
    cursor: pointer;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #176747; color: #fff; }
  button.danger { border-color: #d9a0a0; color: var(--danger); }
  button.danger:hover { background: var(--danger-weak); }
  button.icon { width: 34px; padding: 0; font-weight: 700; }
  button.tab {
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    min-height: 42px;
    padding: 0 14px;
    border-bottom: 3px solid transparent;
  }
  button.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  input, select, textarea {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    padding: 8px 10px;
    min-height: 34px;
  }
  textarea {
    min-height: 82px;
    resize: vertical;
    line-height: 1.45;
    font-family: Consolas, "Courier New", monospace;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid rgba(31, 122, 90, 0.18);
    border-color: var(--accent);
  }
  label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }

  .app {
    min-height: 100%;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
  }
  .sidebar {
    background: #26333a;
    color: #ecf2f0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand-title { font-size: 18px; font-weight: 700; letter-spacing: 0; }
  .brand-subtitle { color: #b7c4c1; font-size: 12px; }
  .sidebar button { width: 100%; background: #314049; color: #f8fbfa; border-color: #4c5f68; }
  .sidebar button:hover { background: #384b54; color: #fff; border-color: #85b8a4; }
  .sidebar button.primary { background: var(--accent); border-color: var(--accent); }
  .side-section { display: flex; flex-direction: column; gap: 8px; }
  .side-title { color: #b7c4c1; font-size: 12px; text-transform: uppercase; letter-spacing: 0; }
  .event-list { display: flex; flex-direction: column; gap: 6px; }
  .event-button.active { border-color: #b9e2d1; background: #3b584f; }
  .status-pill {
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.4;
    background: #314049;
    color: #d9e4e1;
  }
  .status-pill.good { background: #244f3f; color: #e3f7ee; }
  .status-pill.bad { background: #5a3131; color: #ffecec; }
  .status-pill.warn { background: #5a4a25; color: #fff1cf; }
  .file-input { display: none; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 58px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 22px;
  }
  .tabs { display: flex; gap: 2px; align-items: stretch; height: 100%; }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .content { padding: 20px 22px 28px; overflow: auto; }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(110px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .metric {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    min-height: 64px;
  }
  .metric-value { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .metric-label { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .panel-header {
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title { font-size: 15px; font-weight: 700; }
  .panel-body { padding: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .field { min-width: 0; }
  .field.compact input, .field.compact select { min-height: 32px; padding: 6px 8px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { border-bottom: 1px solid var(--line); padding: 9px 8px; text-align: left; vertical-align: middle; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; background: var(--surface-2); }
  td .inline-input { min-height: 30px; padding: 5px 7px; }
  .table-actions { width: 44px; text-align: right; }

  .chapter-layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 16px;
  }
  .chapter-list { display: flex; flex-direction: column; gap: 8px; }
  .chapter-card {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
  }
  .chapter-card.active { border-color: var(--accent); background: var(--accent-weak); }
  .chapter-card-title { font-weight: 700; }
  .chapter-card-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .map-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 16px;
  }
  .graph-box {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: #fbfcfc;
  }
  .graph-svg { display: block; width: 100%; min-height: 420px; }
  .edge { stroke: #9aa8b2; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .node-shape { stroke: #34434b; stroke-width: 2; cursor: pointer; }
  .node-label { fill: #172026; font-size: 13px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .node-sub { fill: #51616b; font-size: 11px; text-anchor: middle; pointer-events: none; }
  .node.selected .node-shape { stroke: #d08b22; stroke-width: 4; }
  .node.entry .node-shape { stroke-dasharray: 5 4; }
  .node.final .node-shape { stroke: #8b2f5b; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.15); }

  .node-list {
    max-height: 420px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .node-row {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr) 54px;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .node-row:last-child { border-bottom: none; }
  .node-row.active { background: var(--accent-weak); }
  .node-kind { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-id { font-weight: 700; }
  .node-fatigue { text-align: right; color: var(--muted); font-size: 12px; }

  .validation-list { display: flex; flex-direction: column; gap: 8px; }
  .message {
    border-radius: 7px;
    padding: 9px 11px;
    line-height: 1.45;
    border: 1px solid var(--line);
  }
  .message.error { color: var(--danger); background: var(--danger-weak); border-color: #f1c6c6; }
  .message.warning { color: var(--warn); background: var(--warn-weak); border-color: #efd693; }
  .message.ok { color: var(--accent); background: var(--accent-weak); border-color: #b9decf; }

  .raw-json {
    min-height: 620px;
    font-size: 12px;
    line-height: 1.5;
  }
  .hidden { display: none !important; }

  @media (max-width: 1120px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .summary-grid { grid-template-columns: repeat(3, minmax(110px, 1fr)); }
    .chapter-layout, .map-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .topbar { height: auto; flex-direction: column; align-items: stretch; padding: 10px; }
    .tabs { overflow-x: auto; height: 42px; }
    .top-actions { flex-wrap: wrap; }
    .top-actions button { flex: 1 1 120px; }
    .content { padding: 12px; }
    .summary-grid, .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">TourEventConfig Editor</div>
      <div class="brand-subtitle">ChallengeEvents/TourEvent/TourEventConfig.json</div>
    </div>

    <div class="side-section">
      <div class="side-title">文件</div>
      <button id="openBtn" class="primary">打开 JSON</button>
      <button id="saveBtn">保存 / 下载</button>
      <button id="copyBtn">复制 JSON</button>
      <input id="fileInput" class="file-input" type="file" accept=".json,application/json">
      <input id="playerCsvInput" class="file-input" type="file" accept=".csv,text/csv">
      <input id="coreAttributesCsvInput" class="file-input" type="file" accept=".csv,text/csv">
    </div>

    <div class="side-section">
      <div class="side-title">活动配置</div>
      <div id="eventList" class="event-list"></div>
      <button id="addEventBtn">+ 新增活动</button>
    </div>

    <div id="statusPill" class="status-pill">未校验</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="activity">活动</button>
        <button class="tab" data-tab="random">随机事件</button>
        <button class="tab" data-tab="chapters">章节地图</button>
        <button class="tab" data-tab="json">JSON</button>
        <button class="tab" data-tab="validate">校验</button>
      </div>
      <div class="top-actions">
        <button id="validateBtn">校验</button>
        <button id="formatBtn">刷新 JSON</button>
      </div>
    </div>

    <div class="content">
      <section id="summary" class="summary-grid"></section>

      <section id="activityTab" class="tab-page"></section>
      <section id="randomTab" class="tab-page hidden"></section>
      <section id="chaptersTab" class="tab-page hidden"></section>
      <section id="jsonTab" class="tab-page hidden"></section>
      <section id="validateTab" class="tab-page hidden"></section>
    </div>
  </main>
</div>

    if (!event.chapters.some((chapter) => chapter.id === event.entryChapterId)) event.entryChapterId = event.chapters[0]?.id || 0;
    event.chapters.forEach(ensureChapterShape);
  }

  function ensureChapterShape(chapter) {
    chapter.nextChapterId = Math.max(0, toInt(chapter.nextChapterId, 0));
    chapter.randomOpponentTeamIds = Array.isArray(chapter.randomOpponentTeamIds) ? chapter.randomOpponentTeamIds : [];
    chapter.chapterRewards = Array.isArray(chapter.chapterRewards) ? chapter.chapterRewards : [];
    chapter.map = chapter.map || {};
    chapter.map.entryNodeIds = Array.isArray(chapter.map.entryNodeIds) ? chapter.map.entryNodeIds : [];
    chapter.map.nodes = Array.isArray(chapter.map.nodes) ? chapter.map.nodes : [];
    chapter.map.adjacencyList = chapter.map.adjacencyList || {};
    if (chapter.map.nodes.length === 0) {
      const base = toInt(chapter.id, 1) * 100 + 1;
      chapter.map.nodes.push(createNodeTemplate(base, defaultMatchRewardAmount(chapter)));
      chapter.map.entryNodeIds = [base];
      chapter.map.finalNodeId = base;
      chapter.map.adjacencyList[String(base)] = [];
    }
    chapter.map.nodes.forEach((node) => {
      delete node.momentChallengeLevelIndex;
      if (MATCH_NODE_TYPES.includes(node.nodeType)) {
        node.rewards = normalizeNodeRewards(node.rewards, defaultMatchRewardAmount(chapter));
      } else if (node.nodeType === 'RandomEvent') {
        if (Array.isArray(node.rewards)) node.rewards = normalizeOptionalNodeRewards(node.rewards, defaultMatchRewardAmount(chapter));
      } else {
        delete node.rewards;
      }
      if (!Array.isArray(chapter.map.adjacencyList[String(node.id)])) chapter.map.adjacencyList[String(node.id)] = [];
    });
    if (!chapter.map.entryNodeIds.length) chapter.map.entryNodeIds = [chapter.map.nodes[0].id];
    if (!chapter.map.finalNodeId) chapter.map.finalNodeId = chapter.map.nodes[chapter.map.nodes.length - 1].id;
  }

      randomEventTextGroups: { '0': ['TourEvent_RandomEvent_NothingHappened'] },
      chapters: [createChapterTemplate(1)]
    };
  }

  function createChapterTemplate(id) {
    const nodeId = id * 100 + 1;
    return {
      id,
      nextChapterId: 0,
      chapterNameId: `TourEvent_Chapter${id}_Name`,
      chapterShortDescId: `TourEvent_Chapter${id}_SD`,

      }

  function createNodeTemplate(id, rewardAmount = defaultMatchRewardAmount(1)) {

    return { type: 'Points', rewardId: 0, amount };
  }

  function createEventRewardTemplate(type = 'Point', amount = 1, firstClearOnly = false) {
    return { type, rewardId: 0, amount, firstClearOnly };
  }

  function createLoopCompletionRewardGroupTemplate(minCompletionCount = 1, maxCompletionCount = 1) {
    return {
      minCompletionCount,
      maxCompletionCount,
      rewards: [createEventRewardTemplate('Point', DEFAULT_LOOP_COMPLETION_REWARD_AMOUNT, false)]

  function normalizeEventRewards(rewards, defaultAmount = 1) {
    const source = Array.isArray(rewards) && rewards.length > 0 ? rewards : [createEventRewardTemplate('Point', defaultAmount, false)];
    return source.map((reward) => ({
      type: String(reward?.type || 'Point'),
      rewardId: toInt(reward?.rewardId, 0),
      amount: toInt(reward?.amount, defaultAmount),
      firstClearOnly: Boolean(reward?.firstClearOnly)
    }));
  }

  function normalizeLoopCompletionRewardGroup(item) {
    const minCompletionCount = Math.max(1, toInt(item?.minCompletionCount, 1));
    const maxCompletionCount = Math.max(minCompletionCount, toInt(item?.maxCompletionCount, minCompletionCount));
    return {
      minCompletionCount,
      maxCompletionCount,
      rewards: normalizeEventRewards(item?.rewards, DEFAULT_LOOP_COMPLETION_REWARD_AMOUNT)
    };
  }

  function defaultMatchRewardAmount(chapterOrId) {
    const id = typeof chapterOrId === 'object' ? toInt(chapterOrId?.id, 1) : toInt(chapterOrId, 1);
    return DEFAULT_MATCH_REWARD_AMOUNTS[id] || DEFAULT_MATCH_REWARD_AMOUNTS[1];
  }

  function normalizeNodeRewards(rewards, rewardAmount = defaultMatchRewardAmount(1)) {
    const source = Array.isArray(rewards) && rewards.length > 0 ? rewards : [createNodeRewardTemplate(rewardAmount)];
    return source.map((reward) => normalizeNodeReward(reward, rewardAmount));
  }

  function normalizeOptionalNodeRewards(rewards, rewardAmount = defaultMatchRewardAmount(1)) {
    if (!Array.isArray(rewards)) return [];
    return rewards.map((reward) => normalizeNodeReward(reward, rewardAmount));
  }

  function normalizeNodeReward(reward, rewardAmount = defaultMatchRewardAmount(1)) {
    return {
      type: String(reward?.type || 'Points'),
      rewardId: toInt(reward?.rewardId, 0),
      amount: toInt(reward?.amount, rewardAmount)
    };
  }

  function defaultSelectableTeamTemplates() {
    return DEFAULT_SELECTABLE_TEAM_IDS.map((teamId) => ({

      teamNameId: DEFAULT_SELECTABLE_TEAM_NAME_IDS[teamId] || '',

      replacementPlayerAbilityRange: clone(DEFAULT_REPLACEMENT_PLAYER_ABILITY_RANGE),
      playerPoolIds: clone(DEFAULT_TEAM_PLAYER_POOLS[teamId] || [])
    }));
  }

  function createTeamTemplate() {
    return { templateTeamId: -1, teamNameId: '', formationRoles: clone(DEFAULT_FORMATION_ROLES), replacementPlayerAbilityRange: clone(DEFAULT_REPLACEMENT_PLAYER_ABILITY_RANGE), playerPoolIds: [] };
  }

  function normalizeTeamTemplate(item) {
    const templateTeamId = toInt(item?.templateTeamId, -1);
    const fallbackPool = DEFAULT_TEAM_PLAYER_POOLS[templateTeamId] || [];
    return {
      templateTeamId,
      teamNameId: String(item?.teamNameId || DEFAULT_SELECTABLE_TEAM_NAME_IDS[templateTeamId] || ''),
      formationRoles: normalizeFormationRoles(item?.formationRoles),
      replacementPlayerAbilityRange: normalizeAbilityRange(item?.replacementPlayerAbilityRange),
      playerPoolIds: Array.isArray(item?.playerPoolIds) ? item.playerPoolIds.map((id) => toInt(id, -1)).filter((id) => id > 0) : clone(fallbackPool)
    };
  }

  function normalizeAbilityRange(value) {
    const minAbility = toInt(value?.minAbility, DEFAULT_REPLACEMENT_PLAYER_ABILITY_RANGE.minAbility);
    const maxAbility = toInt(value?.maxAbility, DEFAULT_REPLACEMENT_PLAYER_ABILITY_RANGE.maxAbility);
    return { minAbility, maxAbility };
  }

  function normalizeFormationRoles(value) {
    let roles = [];
    if (Array.isArray(value)) roles = value;
    else if (typeof value === 'string') roles = parseRoleList(value);
    roles = roles.map((role) => String(role || '').trim().toUpperCase()).filter(Boolean);
    return roles.length > 0 ? roles : clone(DEFAULT_FORMATION_ROLES);
  }

  function normalizeDifficultyValueMap(map) {
    const result = {};
    DIFFICULTIES.forEach((level) => {
      const value = Number(map?.[level]);
      result[level] = Number.isFinite(value) ? value : DEFAULT_MATCH_DIFFICULTY_VALUE_MAP[level];
    });
    return result;
  }

  function findLegacyMomentChallengeLevelIndex(event) {
    for (const chapter of event.chapters || []) {
      for (const node of chapter.map?.nodes || []) {
        if (node.nodeType === 'MomentChallenge' && node.momentChallengeLevelIndex) return node.momentChallengeLevelIndex;
      }
    }
    return '';
  }

      }
    }
    loadConfigText(configText, '内置配置');
    await loadPlayerRatingData();
    renderAll();
    if (state.playerRatingContext) setStatus('内置配置已加载，球员能力表已加载', 'good');
    else setStatus(`内置配置已加载，球员能力表未加载：${state.playerRatingLoadError}`, 'warn');
  }

  async function loadPlayerRatingData() {
    state.playerRatingContext = null;
    state.playerRatingLoadError = '';
    if (!window.PlayerRatingCalculator) {
      state.playerRatingLoadError = 'PlayerRatingCalculator.js 未加载';
      return;
    }
    try {
      state.playerRatingContext = await window.PlayerRatingCalculator.loadPlayerRatingContext({
        playersCsvUrl: PLAYER_RATING_CSV_PATH,
        coreAttributesCsvUrl: CORE_PLAYER_ATTRIBUTES_CSV_PATH
      });
      state.playerRatingSourceName = PLAYER_RATING_CSV_PATH;
    } catch (error) {
      state.playerRatingLoadError = friendlyPlayerRatingLoadError(error);
    }
  }

  function friendlyPlayerRatingLoadError(error) {
    const message = error?.message || String(error || '');
    if (location.protocol === 'file:' || /Failed to fetch/i.test(message)) {
      return `浏览器禁止从本地 HTML 直接读取 ${PLAYER_RATING_CSV_PATH}，请在校验页选择 rawExcels 目录或手动加载 ${RAW_EXCELS_DIR_LABEL}/${PLAYER_CSV_FILE_NAME}。`;
    }
    return message;
  }

  function loadPlayerRatingCsvText(playersCsvText, sourceName) {
    if (!window.PlayerRatingCalculator) {
      state.playerRatingLoadError = 'PlayerRatingCalculator.js 未加载';
      return false;
    }
    try {
      state.playerRatingContext = window.PlayerRatingCalculator.createContext(playersCsvText, state.coreAttributesCsvText);
      state.playerRatingLoadError = '';
      state.playerRatingSourceName = sourceName || 'Players.csv';
      state.playerRatingCsvText = playersCsvText;
      return true;
    } catch (error) {
      state.playerRatingContext = null;
      state.playerRatingLoadError = error.message || String(error);
      return false;
    }
  }

  function loadConfigText(text, sourceName) {
    try {
      state.config = JSON.parse(text);
      ensureConfigShape();
      state.chapterIndex = 0;
      state.selectedNodeId = currentChapter()?.map?.nodes?.[0]?.id || null;
      renderAll();
      setStatus(`${sourceName || 'JSON'} 已加载`, 'good');
    } catch (error) {
      setStatus(`JSON 解析失败：${error.message}`, 'bad');
    }
  }

  function serializeConfig() {
    return JSON.stringify(state.config, null, 4) + '\n';
  }

  function setStatus(text, level) {
    const pill = $('statusPill');
    pill.textContent = text;
    pill.className = `status-pill ${level || ''}`.trim();
  }

  function renderAll() {
    ensureConfigShape();
    renderTabs();
    renderEventList();
    renderSummary();
    renderActivityTab();
    renderRandomTab();
    renderChaptersTab();
    renderJsonTab();
    renderValidation();
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach((button) => {
      button.classList.toggle('active', button.dataset.tab === state.activeTab);
    });
    document.querySelectorAll('.tab-page').forEach((section) => section.classList.add('hidden'));
    $(`${state.activeTab}Tab`)?.classList.remove('hidden');
  }

  function renderEventList() {
    const ids = Object.keys(state.config.tourEvent || {});
    $('eventList').innerHTML = ids.map((id) => `<button class="event-button ${id === state.eventId ? 'active' : ''}" data-event-id="${escapeHtml(id)}">活动 ${escapeHtml(id)}</button>`).join('');
  }

  function renderSummary() {
    const event = currentEvent();
    const chapters = event?.chapters || [];
    const nodes = chapters.flatMap((chapter) => chapter.map?.nodes || []);
    const matchNodes = nodes.filter((node) => MATCH_NODE_TYPES.includes(node.nodeType));
    const randomNodes = nodes.filter((node) => node.nodeType === 'RandomEvent');
    const rules = Object.keys(event?.randomEventRules || {}).length;
    const selectableTeams = event?.selectableTeamTemplates?.length || 0;
    const messages = validateConfig(false);
    $('summary').innerHTML = [
      metric('活动 ID', state.eventId),
      metric('可选队伍', selectableTeams),
      metric('章节', chapters.length),
      metric('节点', nodes.length),
      metric('比赛节点', matchNodes.length),
      metric('随机事件', randomNodes.length),
      metric('问题', messages.errors.length + messages.warnings.length)
    ].join('') + `<div class="metric"><div class="metric-value">${rules}</div><div class="metric-label">随机规则</div></div>`;
  }

  function metric(label, value) {
    return `<div class="metric"><div class="metric-value">${escapeHtml(value)}</div><div class="metric-label">${escapeHtml(label)}</div></div>`;
  }
