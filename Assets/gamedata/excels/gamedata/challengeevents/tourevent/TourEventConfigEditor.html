            <div class="field"><label>随机事件类型</label><select data-node-field="randomEventType">${ruleNames.map((name) => `<option value="${escapeHtml(name)}" ${node.randomEventType === name ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}</select></div>
          `}
        </div>
        ${canConfigureRewards ? renderNodeRewards(node, isMatch ? '比赛节点奖励' : '随机事件节点奖励') : ''}
      </div>
    </div>`;
  }

  function renderNodeRewards(node, title) {
    const rows = (node.rewards || []).map((reward, index) => `
      <tr>
        <td><select data-node-reward-row="${index}" data-node-reward-field="type">${NODE_REWARD_TYPES.map((type) => `<option value="${type}" ${reward.type === type ? 'selected' : ''}>${type}</option>`).join('')}</select></td>
        <td><input class="inline-input" data-node-reward-row="${index}" data-node-reward-field="rewardId" type="number" value="${escapeHtml(reward.rewardId)}"></td>
        <td><input class="inline-input" data-node-reward-row="${index}" data-node-reward-field="amount" type="number" min="0" value="${escapeHtml(reward.amount)}"></td>
        <td class="table-actions"><button class="icon danger" data-delete-node-reward="${index}">-</button></td>
      </tr>`).join('');
    return `<div style="margin-top:14px">
      <div class="panel-header" style="padding:0 0 8px 0;border:0"><div class="panel-title">${escapeHtml(title || '节点奖励')}</div><button data-add-node-reward="true">+ 奖励</button></div>
      <table><thead><tr><th>类型</th><th>奖励 ID</th><th>数量</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }

  function renderGraph(chapter) {
    const nodes = chapter.map.nodes || [];
    const adjacency = chapter.map.adjacencyList || {};
    const positions = layoutNodes(chapter);
    const width = positions.width;
    const height = positions.height;
    const edges = [];
    Object.keys(adjacency).forEach((fromKey) => {
      const from = positions.byId.get(Number(fromKey));
      (adjacency[fromKey] || []).forEach((toId) => {
        const to = positions.byId.get(Number(toId));
        if (from && to) edges.push(renderGraphEdge(from.x + GRAPH_NODE_WIDTH / 2, from.y, to.x - GRAPH_NODE_WIDTH / 2, to.y));
      });
    });
    const finalNode = positions.byId.get(Number(chapter.map.finalNodeId));
    if (finalNode) edges.push(renderGraphEdge(finalNode.x + GRAPH_NODE_WIDTH / 2, finalNode.y, width - 12, finalNode.y));
    const nodeSvg = nodes.map((node) => {
      const pos = positions.byId.get(node.id) || { x: 80, y: 80 };
      const classes = ['node'];
      if (node.id === state.selectedNodeId) classes.push('selected');
      if ((chapter.map.entryNodeIds || []).includes(node.id)) classes.push('entry');
      if (chapter.map.finalNodeId === node.id) classes.push('final');
      return `<g class="${classes.join(' ')}" data-graph-node="${node.id}">
        <rect class="node-shape" x="${pos.x - GRAPH_NODE_WIDTH / 2}" y="${pos.y - GRAPH_NODE_HEIGHT / 2}" width="${GRAPH_NODE_WIDTH}" height="${GRAPH_NODE_HEIGHT}" rx="8" fill="${NODE_COLORS[node.nodeType] || '#eef1f2'}"></rect>
        <text class="node-label" x="${pos.x}" y="${pos.y - 4}">${escapeHtml(node.id)}</text>
        <text class="node-sub" x="${pos.x}" y="${pos.y + 15}">${escapeHtml(shortNodeType(node.nodeType))}</text>
      </g>`;
    }).join('');
    return `<svg class="graph-svg" viewBox="0 0 ${width} ${height}" role="img">
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa8b2"></path></marker></defs>
      ${edges.join('')}
      ${nodeSvg}
    </svg>`;
  }

  function renderGraphEdge(x1, y1, x2, y2) {
    return `<line class="edge" x1="${roundGraphValue(x1)}" y1="${roundGraphValue(y1)}" x2="${roundGraphValue(x2)}" y2="${roundGraphValue(y2)}"></line>`;
  }

  function roundGraphValue(value) {
    return Math.round(value * 10) / 10;
  }

  function shortNodeType(type) {
    return ({ MomentChallenge: 'Moment', FullMatch: 'Full', PenaltyKick: 'Penalty', FreeKick: 'FreeKick', RandomEvent: 'Random' })[type] || type;
  }

  function layoutNodes(chapter) {
    const nodes = chapter.map.nodes || [];
    const adjacency = chapter.map.adjacencyList || {};
    const nodeIds = buildGraphNodeIds(nodes, adjacency, chapter.map.entryNodeIds || [], chapter.map.finalNodeId);
    const graphAdjacency = buildGraphAdjacency(nodeIds, adjacency);
    const entries = buildGraphEntries(nodeIds, graphAdjacency, chapter.map.entryNodeIds || []);
    const edges = buildGraphEdges(nodeIds, graphAdjacency);
    const columns = buildGraphColumns(nodeIds, graphAdjacency, entries);
    forceGraphFinalColumn(columns, edges, chapter.map.finalNodeId);
    const routes = buildGraphRoutes(nodeIds, graphAdjacency, entries, chapter.map.finalNodeId);
    const layout = buildGraphLayoutNodes(nodeIds, columns, routes, edges);
    const maxColumn = Math.max(0, ...Array.from(layout.values()).map((node) => node.column));
    const maxRow = Math.max(0, ...Array.from(layout.values()).map((node) => node.row));
    const width = Math.max(GRAPH_MIN_WIDTH, (maxColumn + 1) * GRAPH_LAYER_GAP + GRAPH_HORIZONTAL_PADDING * 2);
    const height = Math.max(GRAPH_MIN_HEIGHT, (maxRow + 1) * GRAPH_ROW_GAP + GRAPH_VERTICAL_PADDING * 2);
    const left = GRAPH_HORIZONTAL_PADDING;
    const right = width - GRAPH_HORIZONTAL_PADDING;
    const top = GRAPH_VERTICAL_PADDING;
    const bottom = height - GRAPH_VERTICAL_PADDING;
    const byId = new Map();
    layout.forEach((layoutNode) => {
      const x = maxColumn === 0 ? (left + right) * 0.5 : left + (right - left) * layoutNode.column / maxColumn;
      const y = maxRow === 0 ? (top + bottom) * 0.5 : top + (bottom - top) * layoutNode.row / maxRow;
      byId.set(layoutNode.id, { x, y });
    });
    return { byId, width, height };
  }

  function buildGraphNodeIds(nodes, adjacency, entryNodeIds, finalNodeId) {
    const result = [];
    const add = (id) => {
      const value = Number(id);
      if (Number.isInteger(value) && value > 0 && !result.includes(value)) result.push(value);
    };
    nodes.forEach((node) => add(node.id));
    (entryNodeIds || []).forEach(add);
    Object.entries(adjacency || {}).forEach(([from, targets]) => {
      add(from);
      (targets || []).forEach(add);
    });
    add(finalNodeId);
    return result;
  }

  function buildGraphAdjacency(nodeIds, adjacency) {
    const nodeSet = new Set(nodeIds);
    const result = new Map(nodeIds.map((id) => [id, []]));
    Object.entries(adjacency || {}).forEach(([fromKey, targets]) => {
      const fromId = Number(fromKey);
      if (!nodeSet.has(fromId)) return;
      const nextNodes = result.get(fromId);
      (targets || []).forEach((target) => {
        const toId = Number(target);
        if (nodeSet.has(toId) && !nextNodes.includes(toId)) nextNodes.push(toId);
      });
    });
    return result;
  }

  function buildGraphEntries(nodeIds, adjacency, entryNodeIds) {
    const nodeSet = new Set(nodeIds);
    const entries = [];
    (entryNodeIds || []).forEach((id) => {
      const value = Number(id);
      if (nodeSet.has(value) && !entries.includes(value)) entries.push(value);
    });
    if (entries.length) return entries;
    const hasIncoming = new Set();
    adjacency.forEach((targets) => targets.forEach((target) => hasIncoming.add(target)));
    nodeIds.forEach((id) => { if (!hasIncoming.has(id)) entries.push(id); });
    if (!entries.length && nodeIds.length) entries.push(nodeIds[0]);
    return entries;
  }

  function buildGraphEdges(nodeIds, adjacency) {
    const nodeSet = new Set(nodeIds);
    const edges = [];
    nodeIds.forEach((fromId) => {
      (adjacency.get(fromId) || []).forEach((toId) => {
        if (nodeSet.has(toId)) edges.push({ fromId, toId });
      });
    });
    return edges;
  }

  function buildGraphColumns(nodeIds, adjacency, entries) {
    const columns = new Map(nodeIds.map((id) => [id, 0]));
    const incomingCounts = new Map(nodeIds.map((id) => [id, 0]));
    adjacency.forEach((targets) => targets.forEach((toId) => incomingCounts.set(toId, (incomingCounts.get(toId) || 0) + 1)));
    const queue = [];
    const queued = new Set();
    const nodeSet = new Set(nodeIds);
    entries.forEach((entryId) => {
      if (!nodeSet.has(entryId)) return;
      incomingCounts.set(entryId, 0);
      queue.push(entryId);
      queued.add(entryId);
    });
    nodeIds.forEach((id) => {
      if ((incomingCounts.get(id) || 0) === 0 && !queued.has(id)) {
        queue.push(id);
        queued.add(id);
      }
    });
    const processed = new Set();
    while (queue.length) {
      const id = queue.shift();
      processed.add(id);
      (adjacency.get(id) || []).forEach((toId) => {
        columns.set(toId, Math.max(columns.get(toId) || 0, (columns.get(id) || 0) + 1));
        incomingCounts.set(toId, (incomingCounts.get(toId) || 0) - 1);
        if ((incomingCounts.get(toId) || 0) <= 0 && !queued.has(toId)) {
          queue.push(toId);
          queued.add(toId);
        }
      });
    }
    nodeIds.forEach((id) => {
      if (processed.has(id)) return;
      (adjacency.get(id) || []).forEach((toId) => columns.set(toId, Math.max(columns.get(toId) || 0, (columns.get(id) || 0) + 1)));
    });
    return columns;
  }

  function forceGraphFinalColumn(columns, edges, finalNodeId) {
    const finalId = Number(finalNodeId);
    if (!finalId || !columns.has(finalId)) return;
    let finalColumn = 0;
    columns.forEach((column) => { finalColumn = Math.max(finalColumn, column); });
    edges.forEach((edge) => {
      if (edge.toId === finalId && columns.has(edge.fromId)) finalColumn = Math.max(finalColumn, (columns.get(edge.fromId) || 0) + 1);
    });
    columns.set(finalId, finalColumn);
  }

  function buildGraphRoutes(nodeIds, adjacency, entries, finalNodeId) {
    const routes = [];
    const nodeSet = new Set(nodeIds);
    const path = [];
    const visiting = new Set();
    entries.forEach((entryId) => collectGraphRoutes(entryId, Number(finalNodeId), adjacency, nodeSet, path, visiting, routes));
    if (!routes.length) nodeIds.forEach((id) => routes.push([id]));
    return routes;
  }

  function collectGraphRoutes(nodeId, finalNodeId, adjacency, nodeSet, path, visiting, routes) {
    if (routes.length >= GRAPH_MAX_ROUTE_COUNT || !nodeSet.has(nodeId) || visiting.has(nodeId)) return;
    visiting.add(nodeId);
    path.push(nodeId);
    const nextNodes = adjacency.get(nodeId) || [];
    if ((finalNodeId > 0 && nodeId === finalNodeId) || nextNodes.length === 0) {
      routes.push([...path]);
    } else {
      nextNodes.forEach((nextId) => collectGraphRoutes(nextId, finalNodeId, adjacency, nodeSet, path, visiting, routes));
    }
    path.pop();
    visiting.delete(nodeId);
  }

  function buildGraphLayoutNodes(nodeIds, columns, routes, edges) {
    const routeIndexesByNode = buildGraphRouteIndexesByNode(routes);
    const routeCount = Math.max(1, routes.length);
    const nodeCountByColumn = new Map();
    nodeIds.forEach((id) => nodeCountByColumn.set(columns.get(id) || 0, (nodeCountByColumn.get(columns.get(id) || 0) || 0) + 1));
    let rowCount = 1;
    nodeCountByColumn.forEach((count) => { rowCount = Math.max(rowCount, count); });
    rowCount = Math.max(rowCount, Math.min(routeCount, rowCount + 2));
    const routeMaxRow = Math.max(1, routeCount - 1);
    const layoutMaxRow = Math.max(0, rowCount - 1);
    const layout = new Map();
    nodeIds.forEach((id) => {
      const routeIndexes = routeIndexesByNode.get(id) || [];
      let preferredRow = (rowCount - 1) * 0.5;
      if (routeIndexes.length) {
        const sum = routeIndexes.reduce((total, value) => total + value, 0);
        const preferredRouteRow = routeCount === 1 ? 0.5 : sum / routeIndexes.length;
        preferredRow = routeCount === 1 ? layoutMaxRow * 0.5 : preferredRouteRow * layoutMaxRow / routeMaxRow;
      }
      layout.set(id, { id, column: columns.get(id) || 0, row: 0, preferredRow });
    });
    const layers = buildGraphLayers(layout);
    assignGraphInitialRows(layers, rowCount);
    minimizeGraphLayerCrossings(layers, layout, edges, rowCount);
    resolveGraphLineNodeConflicts(layout, edges, rowCount);
    return layout;
  }

  function buildGraphRouteIndexesByNode(routes) {
    const result = new Map();
    routes.forEach((route, routeIndex) => {
      const added = new Set();
      route.forEach((id) => {
        if (added.has(id)) return;
        added.add(id);
        if (!result.has(id)) result.set(id, []);
        result.get(id).push(routeIndex);
      });
    });
    return result;
  }

  function buildGraphLayers(layout) {
    const layers = new Map();
    layout.forEach((node) => {
      if (!layers.has(node.column)) layers.set(node.column, []);
      layers.get(node.column).push(node);
    });
    return layers;
  }

  function assignGraphInitialRows(layers, rowCount) {
    layers.forEach((layer) => {
      layer.sort((left, right) => left.preferredRow - right.preferredRow || left.id - right.id);
      assignGraphSpreadRows(layer, rowCount);
    });
  }

  function minimizeGraphLayerCrossings(layers, layout, edges, rowCount) {
    const layerIndexes = Array.from(layers.keys()).sort((a, b) => a - b);
    let bestRows = captureGraphRows(layout);
    let bestScore = scoreGraphLayout(edges, layout);
    for (let iteration = 0; iteration < GRAPH_LAYER_SORT_ITERATIONS; iteration++) {
      for (let layerIndex = 1; layerIndex < layerIndexes.length; layerIndex++) {
        sortGraphLayerByNeighbors(layers.get(layerIndexes[layerIndex]), layout, edges, rowCount, true);
      }
      ({ bestRows, bestScore } = saveBestGraphRowsIfNeeded(edges, layout, bestRows, bestScore));
      for (let layerIndex = layerIndexes.length - 2; layerIndex >= 0; layerIndex--) {
        sortGraphLayerByNeighbors(layers.get(layerIndexes[layerIndex]), layout, edges, rowCount, false);
      }
      ({ bestRows, bestScore } = saveBestGraphRowsIfNeeded(edges, layout, bestRows, bestScore));
    }
    restoreGraphRows(layout, bestRows);
  }

  function sortGraphLayerByNeighbors(layer, layout, edges, rowCount, useIncoming) {
    const originalOrder = new Map(layer.map((node, index) => [node.id, index]));
    layer.sort((left, right) => {
      const medianCompare = graphNeighborMedianRow(left, layout, edges, useIncoming) - graphNeighborMedianRow(right, layout, edges, useIncoming);
      if (medianCompare !== 0) return medianCompare;
      return originalOrder.get(left.id) - originalOrder.get(right.id) || left.id - right.id;
    });
    assignGraphSpreadRows(layer, rowCount);
  }

  function graphNeighborMedianRow(node, layout, edges, useIncoming) {
    const rows = [];
    edges.forEach((edge) => {
      let neighborId = 0;
      if (useIncoming && edge.toId === node.id) neighborId = edge.fromId;
      else if (!useIncoming && edge.fromId === node.id) neighborId = edge.toId;
      if (!neighborId || !layout.has(neighborId)) return;
      rows.push(layout.get(neighborId).row);
    });
    if (!rows.length) return node.row;
    rows.sort((a, b) => a - b);
    const middle = Math.floor(rows.length / 2);
    return rows.length % 2 ? rows[middle] : (rows[middle - 1] + rows[middle]) * 0.5;
  }

  function assignGraphSpreadRows(layer, rowCount) {
    if (!layer.length) return;
    if (layer.length === 1) {
      layer[0].row = Math.max(0, Math.floor((rowCount - 1) / 2));
      return;
    }
    layer.forEach((node, index) => {
      node.row = Math.round(index * (rowCount - 1) / (layer.length - 1));
    });
  }

  function captureGraphRows(layout) {
    const rows = new Map();
    layout.forEach((node) => rows.set(node.id, node.row));
    return rows;
  }

  function restoreGraphRows(layout, rows) {
    rows.forEach((row, id) => { if (layout.has(id)) layout.get(id).row = row; });
  }

  function saveBestGraphRowsIfNeeded(edges, layout, bestRows, bestScore) {
    const score = scoreGraphLayout(edges, layout);
    if (score >= bestScore) return { bestRows, bestScore };
    return { bestRows: captureGraphRows(layout), bestScore: score };
  }

  function scoreGraphLayout(edges, layout) {
    return countGraphCrossings(edges, layout) * GRAPH_CROSSING_SCORE_WEIGHT + countGraphLineNodeHits(edges, layout) * GRAPH_NODE_HIT_SCORE_WEIGHT;
  }

  function countGraphCrossings(edges, layout) {
    let count = 0;
    for (let leftIndex = 0; leftIndex < edges.length; leftIndex++) {
      for (let rightIndex = leftIndex + 1; rightIndex < edges.length; rightIndex++) {
        if (doGraphEdgesCross(edges[leftIndex], edges[rightIndex], layout)) count++;
      }
    }
    return count;
  }

  function doGraphEdgesCross(left, right, layout) {
    if (left.fromId === right.fromId || left.fromId === right.toId || left.toId === right.fromId || left.toId === right.toId) return false;
    const leftFrom = layout.get(left.fromId);
    const leftTo = layout.get(left.toId);
    const rightFrom = layout.get(right.fromId);
    const rightTo = layout.get(right.toId);
    if (!leftFrom || !leftTo || !rightFrom || !rightTo) return false;
    return graphSegmentsCrossStrict(
      { x: leftFrom.column, y: leftFrom.row },
      { x: leftTo.column, y: leftTo.row },
      { x: rightFrom.column, y: rightFrom.row },
      { x: rightTo.column, y: rightTo.row }
    );
  }

  function countGraphLineNodeHits(edges, layout) {
    let count = 0;
    edges.forEach((edge) => {
      const fromNode = layout.get(edge.fromId);
      const toNode = layout.get(edge.toId);
      if (!fromNode || !toNode) return;
      layout.forEach((node) => { if (doesGraphEdgeHitNode(fromNode, toNode, node)) count++; });
    });
    return count;
  }

  function resolveGraphLineNodeConflicts(layout, edges, rowCount) {
    const maxIterations = Math.max(1, layout.size * rowCount);
    for (let iteration = 0; iteration < maxIterations; iteration++) {
      let changed = false;
      for (const edge of edges) {
        const fromNode = layout.get(edge.fromId);
        const toNode = layout.get(edge.toId);
        if (!fromNode || !toNode) continue;
        const blockerInfo = findGraphLineNodeBlocker(layout, fromNode, toNode);
        if (blockerInfo && moveGraphNodeToFreeRow(blockerInfo.blocker, layout, rowCount, blockerInfo.blockedRow)) {
          changed = true;
          break;
        }
      }
      if (!changed) return;
    }
  }

  function findGraphLineNodeBlocker(layout, fromNode, toNode) {
    for (const node of layout.values()) {
      if (!doesGraphEdgeHitNode(fromNode, toNode, node)) continue;
      return { blocker: node, blockedRow: graphEdgeRowAtColumn(fromNode, toNode, node.column) };
    }
    return null;
  }

  function doesGraphEdgeHitNode(fromNode, toNode, node) {
    if (node.id === fromNode.id || node.id === toNode.id) return false;
    const minColumn = Math.min(fromNode.column, toNode.column);
    const maxColumn = Math.max(fromNode.column, toNode.column);
    if (node.column <= minColumn || node.column >= maxColumn) return false;
    return Math.abs(node.row - graphEdgeRowAtColumn(fromNode, toNode, node.column)) <= 0;
  }

  function graphEdgeRowAtColumn(fromNode, toNode, column) {
    if (fromNode.column === toNode.column) return fromNode.row;
    const t = (column - fromNode.column) / (toNode.column - fromNode.column);
    return Math.round(fromNode.row + (toNode.row - fromNode.row) * t);
  }

  function moveGraphNodeToFreeRow(node, layout, rowCount, blockedRow) {
    const usedRows = new Set();
    layout.forEach((otherNode) => {
      if (otherNode.id !== node.id && otherNode.column === node.column) usedRows.add(otherNode.row);
    });
    const center = clampInt(Math.round(node.preferredRow), 0, rowCount - 1);
    for (let offset = 0; offset < rowCount; offset++) {
      if (tryUseGraphRow(node, usedRows, center + offset, rowCount, blockedRow)) return true;
      if (tryUseGraphRow(node, usedRows, center - offset, rowCount, blockedRow)) return true;
    }
    return false;
  }

  function tryUseGraphRow(node, usedRows, row, rowCount, blockedRow) {
    if (row < 0 || row >= rowCount || row === blockedRow || usedRows.has(row)) return false;
    node.row = row;
    return true;
  }

  function graphSegmentsCrossStrict(firstStart, firstEnd, secondStart, secondEnd) {
    const firstSideA = graphCross(firstStart, firstEnd, secondStart);
    const firstSideB = graphCross(firstStart, firstEnd, secondEnd);
    const secondSideA = graphCross(secondStart, secondEnd, firstStart);
    const secondSideB = graphCross(secondStart, secondEnd, firstEnd);
    if (Math.abs(firstSideA) <= 0.0001 || Math.abs(firstSideB) <= 0.0001 || Math.abs(secondSideA) <= 0.0001 || Math.abs(secondSideB) <= 0.0001) return false;
    return (firstSideA > 0) !== (firstSideB > 0) && (secondSideA > 0) !== (secondSideB > 0);
  }

  function graphCross(origin, axisPoint, point) {
    return (axisPoint.x - origin.x) * (point.y - origin.y) - (axisPoint.y - origin.y) * (point.x - origin.x);
  }

  function clampInt(value, minValue, maxValue) {
    return Math.max(minValue, Math.min(maxValue, value));
  }

  function renderJsonTab() {
    $('jsonTab').innerHTML = `<div class="panel">
      <div class="panel-header"><div class="panel-title">JSON</div><div class="toolbar"><button id="applyJsonBtn">应用 JSON</button></div></div>
      <div class="panel-body"><textarea id="rawJson" class="raw-json">${escapeHtml(serializeConfig())}</textarea></div>
    </div>`;
  }

  function renderValidation() {
    const result = validateConfig(false);
    state.messages = result.errors.map((text) => ({ type: 'error', text })).concat(result.warnings.map((text) => ({ type: 'warning', text })));
    const messages = state.messages.length ? state.messages.map((item) => `<div class="message ${item.type}">${escapeHtml(item.type === 'error' ? `错误：${item.text}` : `警告：${item.text}`)}</div>`).join('') : '<div class="message ok">配置校验通过。</div>';
    $('validateTab').innerHTML = `${renderPlayerRatingTools()}<div class="panel"><div class="panel-header"><div class="panel-title">校验结果</div></div><div class="panel-body"><div class="validation-list">${messages}</div></div></div>`;
    if (result.errors.length) setStatus(`${result.errors.length} 个错误，${result.warnings.length} 个警告`, 'bad');
    else if (result.warnings.length) setStatus(`${result.warnings.length} 个警告`, 'warn');
    else setStatus('配置校验通过', 'good');
  }

  function validateConfig() {
    const errors = [];
    const warnings = [];
    const config = state.config;
    if (!config?.tourEvent || typeof config.tourEvent !== 'object') {
      errors.push('缺少 tourEvent 顶层对象。');
      return { errors, warnings };
    }
    if (!state.playerRatingContext) warnings.push(`未加载 Players.csv，跳过球员池位置和能力校验。${state.playerRatingLoadError || ''}`.trim());
    Object.entries(config.tourEvent).forEach(([eventId, event]) => {
      if (!event.activityNameId) warnings.push(`活动 ${eventId} 缺少 activityNameId。`);
      if (!event.activityLongDescId) warnings.push(`活动 ${eventId} 缺少 activityLongDescId。`);
      if (!event.activityShortDescId) warnings.push(`活动 ${eventId} 缺少 activityShortDescId。`);
      if (!Number.isInteger(event.templateTeamId)) errors.push(`活动 ${eventId} 的 templateTeamId 必须是整数。`);
      if (typeof event.momentChallengeLevelIndex !== 'string' || event.momentChallengeLevelIndex.trim() === '') errors.push(`活动 ${eventId} 缺少 momentChallengeLevelIndex。`);
      if (typeof event.pointsShopConfigIndex !== 'string' || event.pointsShopConfigIndex.trim() === '') errors.push(`活动 ${eventId} 缺少 pointsShopConfigIndex。`);
      if (!Number.isInteger(event.expiredPointCoinExchangeRate) || event.expiredPointCoinExchangeRate <= 0) errors.push(`活动 ${eventId} 的 expiredPointCoinExchangeRate 必须是正整数。`);
      validateDifficultyValueMap(eventId, event, errors);
      validateSelectableTeamTemplates(eventId, event, errors, warnings);
      validateLoopCompletionRewards(eventId, event, errors);
      validateRandomRules(eventId, event, errors, warnings);
      validateChapters(eventId, event, errors, warnings);
    });
    return { errors, warnings };
  }

  function validateLoopCompletionRewards(eventId, event, errors) {
    const groups = event.allChapterCompletionRewards || [];
    groups.forEach((group, groupIndex) => {
      const prefix = `活动 ${eventId} 总通关奖励区间 ${groupIndex + 1}`;
      if (!Number.isInteger(group.minCompletionCount) || group.minCompletionCount < 1) errors.push(`${prefix} 的 minCompletionCount 必须是大于等于 1 的整数。`);
      if (!Number.isInteger(group.maxCompletionCount) || group.maxCompletionCount < group.minCompletionCount) errors.push(`${prefix} 的 maxCompletionCount 必须是大于等于 minCompletionCount 的整数。`);
      if (!Array.isArray(group.rewards) || group.rewards.length === 0) errors.push(`${prefix} 缺少 rewards。`);
      (group.rewards || []).forEach((reward, rewardIndex) => {
        if (!REWARD_TYPES.includes(reward.type)) errors.push(`${prefix} 奖励 ${rewardIndex} 的 type 只能是 Player 或 Point。`);
        if (!Number.isInteger(reward.amount)) errors.push(`${prefix} 奖励 ${rewardIndex} 的 amount 必须是整数。`);
      });
    });
  }

  function validateSelectableTeamTemplates(eventId, event, errors, warnings) {
    const teams = event.selectableTeamTemplates;
    if (!Array.isArray(teams) || teams.length === 0) {
      errors.push(`活动 ${eventId} 缺少 selectableTeamTemplates。`);
      return;
    }
    const uiRoleSet = new Set(UI_ROLES);
    const invalidFormationRoleSet = new Set(INVALID_FORMATION_ROLES);
    const seenTeamIds = new Set();
    teams.forEach((team, index) => {
      const prefix = `活动 ${eventId} 可选模板队伍 ${index + 1}`;
      if (!Number.isInteger(team.templateTeamId)) errors.push(`${prefix} 的 templateTeamId 必须是整数。`);
      if (!team.teamNameId) errors.push(`${prefix} 缺少 teamNameId。`);
      if (seenTeamIds.has(team.templateTeamId)) errors.push(`${prefix} 的 templateTeamId=${team.templateTeamId} 重复。`);
      seenTeamIds.add(team.templateTeamId);
      validateAbilityRange(prefix, team, errors);
      if (!Array.isArray(team.formationRoles)) {
        errors.push(`${prefix} 缺少 formationRoles。`);
      } else {
        if (team.formationRoles.length !== 11) errors.push(`${prefix} 的 formationRoles 必须配置 11 个 UIRole。`);
        if (!team.formationRoles.includes('GK')) errors.push(`${prefix} 的 formationRoles 必须包含 GK。`);
        const seenRoles = new Set();
        team.formationRoles.forEach((role) => {
          if (!uiRoleSet.has(role)) errors.push(`${prefix} 的 formationRoles 包含非法 UIRole：${role}。`);
          if (invalidFormationRoleSet.has(role)) errors.push(`${prefix} 的 formationRoles 不能配置 ${role}。`);
          if (seenRoles.has(role)) warnings.push(`${prefix} 的 formationRoles 重复配置 ${role}。`);
          seenRoles.add(role);
        });
      }
      if (!Array.isArray(team.playerPoolIds) || team.playerPoolIds.length === 0) errors.push(`${prefix} 缺少 playerPoolIds。`);
      const seenPlayerIds = new Set();
      (team.playerPoolIds || []).forEach((playerId) => {
        if (!Number.isInteger(playerId)) errors.push(`${prefix} 的 playerPoolIds 只能配置整数。`);
        if (seenPlayerIds.has(playerId)) warnings.push(`${prefix} 的 playerPoolIds 重复配置球员 ${playerId}。`);
        seenPlayerIds.add(playerId);
      });
      validateTeamPlayerPoolCoverage(prefix, team, errors, warnings);
    });
    if (teams.length !== 8) warnings.push(`活动 ${eventId} 当前可选模板队伍数量为 ${teams.length}，设计稿种子国家为 8 个。`);
  }

  function validateAbilityRange(prefix, team, errors) {
    const range = normalizeAbilityRange(team.replacementPlayerAbilityRange);
    if (!Number.isInteger(range.minAbility)) errors.push(`${prefix} 的 replacementPlayerAbilityRange.minAbility 必须是整数。`);
    if (!Number.isInteger(range.maxAbility)) errors.push(`${prefix} 的 replacementPlayerAbilityRange.maxAbility 必须是整数。`);
    if (range.minAbility < 0 || range.maxAbility < 0) errors.push(`${prefix} 的能力上下限不能小于 0。`);
    if (range.minAbility > range.maxAbility) errors.push(`${prefix} 的能力下限不能大于上限。`);
  }

  function validateTeamPlayerPoolCoverage(prefix, team, errors, warnings) {
    if (!state.playerRatingContext || !window.PlayerRatingCalculator) return;
    const range = normalizeAbilityRange(team.replacementPlayerAbilityRange);
    const poolIds = Array.isArray(team.playerPoolIds) ? team.playerPoolIds : [];
    const missingIds = poolIds.filter((playerId) => !state.playerRatingContext.playersById.has(playerId));
    if (missingIds.length) warnings.push(`${prefix} 的 playerPoolIds 在 Players.csv 中不存在：${missingIds.slice(0, 8).join(', ')}${missingIds.length > 8 ? '...' : ''}。`);
    (team.formationRoles || []).forEach((role) => {
      if (!UI_ROLES.includes(role) || INVALID_FORMATION_ROLES.includes(role)) return;
      const rewardResult = window.PlayerRatingCalculator.findQualifiedPlayers(state.playerRatingContext, poolIds, role, range, false);
      if (rewardResult.exact.length === 0 && rewardResult.categoryFallback.length === 0) {
        errors.push(`${prefix} 阵型位置 ${role} 在球员池中没有位置或类别匹配的球员。`);
      } else if (rewardResult.exact.length === 0) {
        warnings.push(`${prefix} 阵型位置 ${role} 没有同位置球员，赛后抽卡会回退到同类别球员池。`);
      }
      if (window.PlayerRatingCalculator.categoryForRole(role) === 'Goalkeeper') return;
      const initialResult = window.PlayerRatingCalculator.findQualifiedPlayers(state.playerRatingContext, poolIds, role, range, true);
      if (initialResult.exact.length === 0 && initialResult.categoryFallback.length === 0) {
        errors.push(`${prefix} 初始首发位置 ${role} 在球员池中没有能力 ${range.minAbility}-${range.maxAbility} 且位置或类别匹配的球员。`);
      } else if (initialResult.exact.length === 0) {
        warnings.push(`${prefix} 初始首发位置 ${role} 没有能力 ${range.minAbility}-${range.maxAbility} 的同位置球员，初始抽取会回退到同类别球员池。`);
      }
    });
  }

  function validateDifficultyValueMap(eventId, event, errors) {
    const map = event.matchDifficultyValueMap;
    if (!map || typeof map !== 'object') {
      errors.push(`活动 ${eventId} 缺少 matchDifficultyValueMap。`);
      return;
    }
    DIFFICULTIES.forEach((level) => {
      const value = Number(map[level]);
      if (!Number.isFinite(value)) errors.push(`活动 ${eventId} 的 matchDifficultyValueMap.${level} 必须是 float 数值。`);
    });
  }

  function validateRandomRules(eventId, event, errors, warnings) {
    const rules = event.randomEventRules || {};
    const textGroups = event.randomEventTextGroups || {};
    Object.entries(rules).forEach(([ruleName, rule]) => {
      if (!Array.isArray(rule.fatigueRange) || rule.fatigueRange.length !== 2) errors.push(`活动 ${eventId} 规则 ${ruleName} 的 fatigueRange 必须是两个整数。`);
      if (!Array.isArray(rule.weights) || rule.weights.length === 0) errors.push(`活动 ${eventId} 规则 ${ruleName} 缺少 weights。`);
      const sum = (rule.weights || []).reduce((total, item) => total + Number(item.weight || 0), 0);
      if (sum !== 100) warnings.push(`活动 ${eventId} 规则 ${ruleName} 权重合计为 ${sum}，建议为 100。`);
      const seen = new Set();
      (rule.weights || []).forEach((item) => {
        if (seen.has(item.fatigueValue)) errors.push(`活动 ${eventId} 规则 ${ruleName} 重复配置 fatigueValue=${item.fatigueValue}。`);
        seen.add(item.fatigueValue);
        const range = rule.fatigueRange || [0, 0];
        if (item.fatigueValue < range[0] || item.fatigueValue > range[1]) errors.push(`活动 ${eventId} 规则 ${ruleName} 的 fatigueValue=${item.fatigueValue} 超出 fatigueRange。`);
        const key = fatigueKey(item.fatigueValue);
        if (!Array.isArray(textGroups[key]) || textGroups[key].length === 0) warnings.push(`活动 ${eventId} fatigueValue=${key} 没有可用文本组。`);
      });
    });
  }

  function validateChapters(eventId, event, errors, warnings) {
    const chapters = event.chapters || [];
    if (!Array.isArray(chapters) || chapters.length === 0) errors.push(`活动 ${eventId} 缺少 chapters。`);
    const chapterIds = new Set();
    chapters.forEach((chapter, chapterIndex) => {
      const prefix = `活动 ${eventId} 章节 ${chapter.id ?? chapterIndex}`;
      if (chapterIds.has(chapter.id)) errors.push(`${prefix} 的章节 ID 重复。`);
      chapterIds.add(chapter.id);
      if (!Number.isInteger(chapter.fatigueLimit)) errors.push(`${prefix} 的 fatigueLimit 必须是整数。`);
      (chapter.chapterRewards || []).forEach((reward, rewardIndex) => {
        if (!REWARD_TYPES.includes(reward.type)) errors.push(`${prefix} 奖励 ${rewardIndex} 的 type 只能是 Player 或 Point。`);
        if (!Number.isInteger(reward.amount)) errors.push(`${prefix} 奖励 ${rewardIndex} 的 amount 必须是整数。`);
      });
      validateMap(prefix, chapter, event, errors, warnings);
    });
    if (!Number.isInteger(event.entryChapterId) || !chapterIds.has(event.entryChapterId)) errors.push(`活动 ${eventId} 的 entryChapterId 必须指向已存在的章节。`);
    chapters.forEach((chapter, chapterIndex) => {
      const prefix = `活动 ${eventId} 章节 ${chapter.id ?? chapterIndex}`;
      if (!Number.isInteger(chapter.nextChapterId) || chapter.nextChapterId < 0) errors.push(`${prefix} 的 nextChapterId 必须是大于等于 0 的整数。`);
      else if (chapter.nextChapterId > 0) {
        if (!chapterIds.has(chapter.nextChapterId)) errors.push(`${prefix} 的 nextChapterId=${chapter.nextChapterId} 指向不存在的章节。`);
        if (chapter.nextChapterId === chapter.id) errors.push(`${prefix} 的 nextChapterId 不能指向自身。`);
      }
    });
    validateChapterChains(eventId, chapters, errors);
  }

  function validateChapterChains(eventId, chapters, errors) {
    const chapterById = new Map(chapters.map((chapter) => [chapter.id, chapter]));
    const reportedCycles = new Set();
    chapters.forEach((startChapter) => {
      const visitedIds = new Set();
      let chapter = startChapter;
      while (chapter && chapter.nextChapterId > 0) {
        if (visitedIds.has(chapter.id)) {
          const key = [...visitedIds].sort((left, right) => left - right).join('>');
          if (!reportedCycles.has(key)) errors.push(`活动 ${eventId} 章节链存在循环：${key}。`);
          reportedCycles.add(key);
          return;
        }
        visitedIds.add(chapter.id);
        chapter = chapterById.get(chapter.nextChapterId);
      }
    });
  }

  function validateMap(prefix, chapter, event, errors, warnings) {
    const map = chapter.map || {};
    const nodes = map.nodes || [];
    const nodeIds = new Set();
    nodes.forEach((node) => {
      if (nodeIds.has(node.id)) errors.push(`${prefix} 节点 ID ${node.id} 重复。`);
      nodeIds.add(node.id);
      if (!NODE_TYPES.includes(node.nodeType)) errors.push(`${prefix} 节点 ${node.id} 的 nodeType 无效。`);
      if (!Number.isInteger(node.fatigueValue)) errors.push(`${prefix} 节点 ${node.id} 的 fatigueValue 必须是整数。`);
      if (MATCH_NODE_TYPES.includes(node.nodeType)) {
        if (!Number.isInteger(node.opponentId)) errors.push(`${prefix} 比赛节点 ${node.id} 缺少 opponentId。`);
        if (node.opponentId === -1 && (!Array.isArray(chapter.randomOpponentTeamIds) || chapter.randomOpponentTeamIds.length === 0)) errors.push(`${prefix} 比赛节点 ${node.id} 使用随机对手，但章节随机对手池为空。`);
        if (!DIFFICULTIES.includes(node.difficultyLevel)) errors.push(`${prefix} 比赛节点 ${node.id} 的 difficultyLevel 无效。`);
        validateNodeRewards(prefix, node, '比赛节点', true, errors);
      }
      if (node.nodeType === 'RandomEvent') {
        if (!event.randomEventRules?.[node.randomEventType]) errors.push(`${prefix} 随机事件节点 ${node.id} 引用了不存在的 randomEventType。`);
        validateNodeRewards(prefix, node, '随机事件节点', false, errors);
      }
    });
    (map.entryNodeIds || []).forEach((id) => { if (!nodeIds.has(id)) errors.push(`${prefix} 起点节点 ${id} 不存在。`); });
    if (!nodeIds.has(map.finalNodeId)) errors.push(`${prefix} 终点节点 ${map.finalNodeId} 不存在。`);
    const adjacency = map.adjacencyList || {};
    nodes.forEach((node) => {
      if (!Array.isArray(adjacency[String(node.id)])) warnings.push(`${prefix} 节点 ${node.id} 缺少邻接表项。`);
    });
    Object.entries(adjacency).forEach(([from, targets]) => {
      if (!nodeIds.has(Number(from))) errors.push(`${prefix} 邻接表源节点 ${from} 不存在。`);
      (targets || []).forEach((target) => { if (!nodeIds.has(Number(target))) errors.push(`${prefix} 邻接表目标节点 ${target} 不存在。`); });
    });
    const finalTargets = adjacency[String(map.finalNodeId)] || [];
    if (finalTargets.length > 0) warnings.push(`${prefix} 终点节点不为空。`);
    const reachable = collectReachable(map.entryNodeIds || [], adjacency);
    nodes.forEach((node) => { if (!reachable.has(node.id)) warnings.push(`${prefix} 节点 ${node.id} 无法从起点到达。`); });
    if (!reachable.has(map.finalNodeId)) errors.push(`${prefix} 终点节点无法从起点到达。`);
    if (hasCycle(nodes, adjacency)) warnings.push(`${prefix} 存在回环边。`);
  }

  function validateNodeRewards(prefix, node, label, required, errors) {
    if (!Array.isArray(node.rewards) || node.rewards.length === 0) {
      if (required) errors.push(`${prefix} ${label} ${node.id} 缺少 rewards。`);
      return;
    }
    node.rewards.forEach((reward, rewardIndex) => {
      if (!NODE_REWARD_TYPES.includes(reward.type)) errors.push(`${prefix} ${label} ${node.id} 奖励 ${rewardIndex} 的 type 只能是 Points。`);
      if (!Number.isInteger(reward.rewardId)) errors.push(`${prefix} ${label} ${node.id} 奖励 ${rewardIndex} 的 rewardId 必须是整数。`);
      if (!Number.isInteger(reward.amount) || reward.amount <= 0) errors.push(`${prefix} ${label} ${node.id} 奖励 ${rewardIndex} 的 amount 必须是正整数。`);
    });
  }

  function collectReachable(entryIds, adjacency) {
    const reached = new Set();
    const queue = [...entryIds];
    while (queue.length) {
      const id = Number(queue.shift());
      if (reached.has(id)) continue;
      reached.add(id);
      (adjacency[String(id)] || []).forEach((next) => queue.push(next));
    }
    return reached;
  }

  function hasCycle(nodes, adjacency) {
    const visiting = new Set();
    const visited = new Set();
    function visit(id) {
      if (visiting.has(id)) return true;
      if (visited.has(id)) return false;
      visiting.add(id);
      for (const next of adjacency[String(id)] || []) {
        if (visit(Number(next))) return true;
      }
      visiting.delete(id);
      visited.add(id);
      return false;
    }
    return nodes.some((node) => visit(node.id));
  }

  function updateActivityField(input) {
    const event = currentEvent();
    const key = input.dataset.activityField;
    event[key] = input.type === 'number' ? toInt(input.value) : input.value.trim();
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function updateDifficultyValue(input) {
    const event = currentEvent();
    const level = input.dataset.difficultyValue;
    const rawValue = input.value.trim();
    event.matchDifficultyValueMap[level] = rawValue === '' ? '' : Number(rawValue);
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function updateChapterField(input) {
    const chapter = currentChapter();
    const key = input.dataset.chapterField;
    const oldId = chapter.id;
    chapter[key] = input.type === 'number' ? toInt(input.value) : input.value.trim();
    if (key === 'id' && chapter.id !== oldId) renderChaptersTab();
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function updateMapField(input) {
    const chapter = currentChapter();
    chapter.map[input.dataset.mapField] = toInt(input.value);
    renderChaptersTab();
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function updateNodeField(input) {
    const chapter = currentChapter();
    const node = currentNode();
    const key = input.dataset.nodeField;
    if (key === 'id') {
      renameNode(chapter, node.id, toInt(input.value));
      renderAll();
      return;
    }
    if (key === 'nodeType') {
      node.nodeType = input.value;
      if (MATCH_NODE_TYPES.includes(node.nodeType)) {
        node.opponentId = Number.isInteger(node.opponentId) ? node.opponentId : -1;
        node.difficultyLevel = DIFFICULTIES.includes(node.difficultyLevel) ? node.difficultyLevel : 'Easy';
        node.rewards = normalizeNodeRewards(node.rewards, defaultMatchRewardAmount(chapter));
        delete node.randomEventType;
      } else {
        node.randomEventType = node.randomEventType || Object.keys(currentEvent().randomEventRules || {})[0] || 'TypeOne';
        node.rewards = normalizeOptionalNodeRewards(node.rewards, defaultMatchRewardAmount(chapter));
        delete node.opponentId;
        delete node.difficultyLevel;
      }
    } else if (input.type === 'number') {
      node[key] = toInt(input.value);
    } else {
      node[key] = input.value;
    }
    renderChaptersTab();
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function renameNode(chapter, oldId, newId) {
    if (!Number.isInteger(newId) || oldId === newId) return;
    if (chapter.map.nodes.some((node) => node.id === newId)) {
      setStatus(`节点 ${newId} 已存在`, 'bad');
      return;
    }
    const node = chapter.map.nodes.find((item) => item.id === oldId);
    if (!node) return;
    node.id = newId;
    const oldKey = String(oldId);
    const newKey = String(newId);
    chapter.map.adjacencyList[newKey] = chapter.map.adjacencyList[oldKey] || [];
    delete chapter.map.adjacencyList[oldKey];
    Object.keys(chapter.map.adjacencyList).forEach((key) => {
      chapter.map.adjacencyList[key] = (chapter.map.adjacencyList[key] || []).map((id) => id === oldId ? newId : id);
    });
    chapter.map.entryNodeIds = (chapter.map.entryNodeIds || []).map((id) => id === oldId ? newId : id);
    if (chapter.map.finalNodeId === oldId) chapter.map.finalNodeId = newId;
    state.selectedNodeId = newId;
  }

  function updateSuccessors(input) {
    const chapter = currentChapter();
    const node = currentNode();
    chapter.map.adjacencyList[String(node.id)] = parseIntList(input.value);
    renderChaptersTab();
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function wireEvents() {
    $('tabs').addEventListener('click', (event) => {
      const tab = event.target.closest('[data-tab]');
      if (!tab) return;
      state.activeTab = tab.dataset.tab;
      renderAll();
    });
    $('openBtn').addEventListener('click', openJsonFile);
    $('saveBtn').addEventListener('click', saveJsonFile);
    $('copyBtn').addEventListener('click', copyJson);
    $('validateBtn').addEventListener('click', () => { state.activeTab = 'validate'; renderAll(); });
    $('formatBtn').addEventListener('click', () => { state.activeTab = 'json'; renderAll(); });
    $('addEventBtn').addEventListener('click', addEvent);
    $('fileInput').addEventListener('change', readSelectedFile);
    $('playerCsvInput').addEventListener('change', readSelectedPlayerCsvFile);
    $('coreAttributesCsvInput').addEventListener('change', readSelectedCoreAttributesCsvFile);

    document.addEventListener('click', (event) => {
      const eventButton = event.target.closest('[data-event-id]');
      if (eventButton) { state.eventId = eventButton.dataset.eventId; state.chapterIndex = 0; state.selectedNodeId = null; renderAll(); return; }
      const chapterCard = event.target.closest('[data-chapter-index]');
      if (chapterCard) { state.chapterIndex = Number(chapterCard.dataset.chapterIndex); state.selectedNodeId = null; renderAll(); return; }
      const nodeRow = event.target.closest('[data-node-row]');
      if (nodeRow) { state.selectedNodeId = Number(nodeRow.dataset.nodeRow); renderChaptersTab(); return; }
      const graphNode = event.target.closest('[data-graph-node]');
      if (graphNode) { state.selectedNodeId = Number(graphNode.dataset.graphNode); renderChaptersTab(); return; }
      if (event.target.id === 'addChapterBtn') addChapter();
      if (event.target.id === 'duplicateChapterBtn') duplicateChapter();
      if (event.target.id === 'deleteChapterBtn') deleteChapter();
      if (event.target.id === 'addNodeBtn') addNode();
      if (event.target.id === 'deleteNodeBtn') deleteNode();
      if (event.target.dataset.addNodeReward) addNodeReward();
      if (event.target.dataset.deleteNodeReward) deleteNodeReward(Number(event.target.dataset.deleteNodeReward));
      if (event.target.id === 'addTeamTemplateBtn') addTeamTemplate();
      if (event.target.dataset.deleteTeamTemplate) deleteTeamTemplate(Number(event.target.dataset.deleteTeamTemplate));
      if (event.target.id === 'addLoopCompletionRewardGroupBtn') addLoopCompletionRewardGroup();
      if (event.target.dataset.deleteLoopGroup) deleteLoopCompletionRewardGroup(Number(event.target.dataset.deleteLoopGroup));
      if (event.target.dataset.addLoopReward !== undefined) addLoopCompletionReward(Number(event.target.dataset.addLoopReward));
      if (event.target.dataset.deleteLoopReward !== undefined) deleteLoopCompletionReward(Number(event.target.dataset.deleteLoopRewardGroup), Number(event.target.dataset.deleteLoopReward));
      if (event.target.id === 'addRewardBtn') addReward();
      if (event.target.dataset.deleteReward) deleteReward(Number(event.target.dataset.deleteReward));
      if (event.target.id === 'addRuleBtn') addRule();
      if (event.target.id === 'deleteRuleBtn') deleteRule();
      if (event.target.id === 'addRuleRowBtn') addRuleRow();
      if (event.target.dataset.deleteRuleRow) deleteRuleRow(Number(event.target.dataset.deleteRuleRow));
      if (event.target.id === 'applyJsonBtn') applyRawJson();
      if (event.target.id === 'selectRawExcelsDirBtn') selectRawExcelsDirectory();
      if (event.target.id === 'loadPlayersCsvBtn') openPlayerCsvFile();
      if (event.target.id === 'loadCoreAttributesCsvBtn') openCoreAttributesCsvFile();
    });

    document.addEventListener('change', (event) => {
      const target = event.target;
      if (target.dataset.activityField) updateActivityField(target);
      if (target.dataset.difficultyValue) updateDifficultyValue(target);
      if (target.dataset.chapterField) updateChapterField(target);
      if (target.dataset.chapterList) { currentChapter()[target.dataset.chapterList] = parseIntList(target.value); renderAll(); }
      if (target.dataset.mapList) { currentChapter().map[target.dataset.mapList] = parseIntList(target.value); renderAll(); }
      if (target.dataset.mapField) updateMapField(target);
      if (target.dataset.nodeField) updateNodeField(target);
      if (target.dataset.nodeRewardRow) updateNodeReward(target);
      if (target.dataset.successors !== undefined) updateSuccessors(target);
      if (target.dataset.teamRow) updateTeamTemplate(target);
      if (target.dataset.loopGroupRow) updateLoopCompletionRewardGroup(target);
      if (target.dataset.loopRewardRow) updateLoopCompletionReward(target);
      if (target.dataset.rewardRow) updateReward(target);
      if (target.dataset.ruleRow) updateRuleRow(target);
      if (target.dataset.textGroup) updateTextGroup(target);
      if (target.id === 'ruleSelect') { state.ruleName = target.value; renderAll(); }
      if (target.id === 'ruleNameInput') renameRule(target.value.trim());
      if (target.id === 'ruleMinInput' || target.id === 'ruleMaxInput') updateRuleRange();
    });
  }

  async function openJsonFile() {
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }], multiple: false });
        state.fileHandle = handle;
        const file = await handle.getFile();
        loadConfigText(await file.text(), file.name);
        return;
      } catch (error) {
        if (error.name !== 'AbortError') setStatus(`打开失败：${error.message}`, 'bad');
      }
    }
    $('fileInput').click();
  }

  async function readSelectedFile(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    loadConfigText(await file.text(), file.name);
    event.target.value = '';
  }

  async function readSelectedPlayerCsvFile(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    const loaded = await loadPlayerRatingFile(file);
    renderAll();
    setStatus(loaded ? `球员能力表已加载：${file.name}` : `球员能力表加载失败：${state.playerRatingLoadError}`, loaded ? 'good' : 'bad');
    event.target.value = '';
  }

  async function readSelectedCoreAttributesCsvFile(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    await loadCoreAttributesFile(file);
    renderAll();
    setStatus(`CorePlayerAttributes 已加载：${file.name}`, 'good');
    event.target.value = '';
  }

  async function openPlayerCsvFile() {
    await openCsvFile(PLAYER_CSV_FILE_NAME, 'Players.csv', 'playerCsvInput', loadPlayerRatingFile, '球员能力表');
  }

  async function openCoreAttributesCsvFile() {
    await openCsvFile(CORE_PLAYER_ATTRIBUTES_CSV_FILE_NAME, 'CorePlayerAttributes.csv', 'coreAttributesCsvInput', loadCoreAttributesFile, 'CorePlayerAttributes');
  }

  async function openCsvFile(defaultFileName, pickerDescription, fallbackInputId, loadFile, successLabel) {
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker(csvPickerOptions(pickerDescription));
        const file = await handle.getFile();
        const loaded = await loadFile(file);
        renderAll();
        setStatus(loaded ? `${successLabel}已加载：${file.name}` : `${successLabel}加载失败：${state.playerRatingLoadError}`, loaded ? 'good' : 'bad');
        return;
      } catch (error) {
        if (error.name !== 'AbortError') setStatus(`${defaultFileName} 打开失败：${error.message}`, 'bad');
        return;
      }
    }
    $(fallbackInputId).click();
  }

  function csvPickerOptions(description) {
    const options = {
      id: RAW_EXCELS_PICKER_ID,
      multiple: false,
      excludeAcceptAllOption: false,
      types: [{ description, accept: { 'text/csv': ['.csv'] } }]
    };
    if (state.rawExcelsDirectoryHandle) options.startIn = state.rawExcelsDirectoryHandle;
    return options;
  }

  async function selectRawExcelsDirectory() {
    if (!window.showDirectoryPicker) {
      setStatus('当前浏览器不支持选择目录，请使用加载按钮手动选择 CSV。', 'warn');
      return;
    }
    try {
      const directoryHandle = await window.showDirectoryPicker({ id: RAW_EXCELS_PICKER_ID, mode: 'read' });
      state.rawExcelsDirectoryHandle = directoryHandle;
      state.rawExcelsDirectoryName = directoryHandle.name || RAW_EXCELS_DIR_LABEL;
      const coreFile = await tryGetDirectoryFile(directoryHandle, CORE_PLAYER_ATTRIBUTES_CSV_FILE_NAME);
      const playersFile = await tryGetDirectoryFile(directoryHandle, PLAYER_CSV_FILE_NAME);
      let loadedCore = false;
      let loadedPlayers = false;
      if (coreFile) loadedCore = await loadCoreAttributesFile(coreFile);
      if (playersFile) loadedPlayers = await loadPlayerRatingFile(playersFile);
      renderAll();
      if (loadedPlayers) {
        setStatus(`rawExcels 目录已选择，已加载 ${PLAYER_CSV_FILE_NAME}${loadedCore ? ` 和 ${CORE_PLAYER_ATTRIBUTES_CSV_FILE_NAME}` : ''}`, 'good');
      } else {
        state.playerRatingLoadError = `${state.rawExcelsDirectoryName} 中未找到 ${PLAYER_CSV_FILE_NAME}`;
        renderAll();
        setStatus(`rawExcels 目录已选择，但未找到 ${PLAYER_CSV_FILE_NAME}`, 'warn');
      }
    } catch (error) {
      if (error.name !== 'AbortError') setStatus(`rawExcels 目录选择失败：${error.message}`, 'bad');
    }
  }

  async function tryGetDirectoryFile(directoryHandle, fileName) {
    try {
      const fileHandle = await directoryHandle.getFileHandle(fileName);
      return await fileHandle.getFile();
    } catch (error) {
      return null;
    }
  }

  async function loadPlayerRatingFile(file) {
    return loadPlayerRatingCsvText(await file.text(), file.name);
  }

  async function loadCoreAttributesFile(file) {
    state.coreAttributesCsvText = await file.text();
    state.coreAttributesSourceName = file.name;
    if (state.playerRatingCsvText) loadPlayerRatingCsvText(state.playerRatingCsvText, state.playerRatingSourceName);
    return true;
  }

  async function saveJsonFile() {
    const text = serializeConfig();
    if (state.fileHandle?.createWritable) {
      try {
        const writable = await state.fileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        setStatus('已保存到已打开文件', 'good');
        return;
      } catch (error) {
        setStatus(`保存失败：${error.message}`, 'bad');
      }
    }
    const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'TourEventConfig.json';
    link.click();
    URL.revokeObjectURL(url);
    setStatus('已生成下载文件', 'good');
  }

  async function copyJson() {
    try {
      await navigator.clipboard.writeText(serializeConfig());
      setStatus('JSON 已复制', 'good');
    } catch (error) {
      setStatus(`复制失败：${error.message}`, 'bad');
    }
  }

  function addEvent() {
    const ids = Object.keys(state.config.tourEvent).map((id) => Number(id)).filter(Number.isFinite);
    const nextId = String((Math.max(0, ...ids) || 0) + 1);
    state.config.tourEvent[nextId] = createEventTemplate();
    state.eventId = nextId;
    state.chapterIndex = 0;
    state.selectedNodeId = null;
    renderAll();
  }

  function addChapter() {
    const event = currentEvent();
    const nextId = Math.max(0, ...event.chapters.map((chapter) => Number(chapter.id) || 0)) + 1;
    event.chapters.push(createChapterTemplate(nextId));
    state.chapterIndex = event.chapters.length - 1;
    state.selectedNodeId = null;
    renderAll();
  }

  function duplicateChapter() {
    const event = currentEvent();
    const source = currentChapter();
    const nextId = Math.max(0, ...event.chapters.map((chapter) => Number(chapter.id) || 0)) + 1;
    const copy = clone(source);
    const oldIds = copy.map.nodes.map((node) => node.id);
    const base = nextId * 100;
    const mapping = new Map(oldIds.map((id, index) => [id, base + index + 1]));
    copy.id = nextId;
    copy.chapterNameId = `TourEvent_Chapter${nextId}_Name`;
    copy.chapterShortDescId = `TourEvent_Chapter${nextId}_SD`;
    copy.map.nodes.forEach((node) => { node.id = mapping.get(node.id); });
    copy.map.entryNodeIds = copy.map.entryNodeIds.map((id) => mapping.get(id)).filter(Boolean);
    copy.map.finalNodeId = mapping.get(copy.map.finalNodeId) || copy.map.nodes[copy.map.nodes.length - 1].id;
    const adjacency = {};
    Object.entries(copy.map.adjacencyList).forEach(([from, targets]) => {
      const newFrom = mapping.get(Number(from));
      if (newFrom) adjacency[String(newFrom)] = (targets || []).map((id) => mapping.get(Number(id))).filter(Boolean);
    });
    copy.map.adjacencyList = adjacency;
    event.chapters.push(copy);
    state.chapterIndex = event.chapters.length - 1;
    state.selectedNodeId = copy.map.nodes[0]?.id || null;
    renderAll();
  }

  function deleteChapter() {
    const event = currentEvent();
    if (event.chapters.length <= 1) { setStatus('至少保留一个章节', 'bad'); return; }
    event.chapters.splice(state.chapterIndex, 1);
    state.chapterIndex = Math.max(0, state.chapterIndex - 1);
    state.selectedNodeId = null;
    renderAll();
  }

  function addNode() {
    const chapter = currentChapter();
    const nextId = Math.max(0, ...chapter.map.nodes.map((node) => Number(node.id) || 0)) + 1;
    chapter.map.nodes.push(createNodeTemplate(nextId, defaultMatchRewardAmount(chapter)));
    chapter.map.adjacencyList[String(nextId)] = [];
    const selected = currentNode();
    if (selected && selected.id !== nextId) {
      const list = chapter.map.adjacencyList[String(selected.id)] || [];
      if (!list.includes(nextId)) list.push(nextId);
      chapter.map.adjacencyList[String(selected.id)] = list;
    }
    state.selectedNodeId = nextId;
    renderAll();
  }

  function deleteNode() {
    const chapter = currentChapter();
    const node = currentNode();
    if (!node || chapter.map.nodes.length <= 1) { setStatus('至少保留一个节点', 'bad'); return; }
    chapter.map.nodes = chapter.map.nodes.filter((item) => item.id !== node.id);
    delete chapter.map.adjacencyList[String(node.id)];
    Object.keys(chapter.map.adjacencyList).forEach((key) => {
      chapter.map.adjacencyList[key] = (chapter.map.adjacencyList[key] || []).filter((id) => id !== node.id);
    });
    chapter.map.entryNodeIds = chapter.map.entryNodeIds.filter((id) => id !== node.id);
    if (!chapter.map.entryNodeIds.length) chapter.map.entryNodeIds = [chapter.map.nodes[0].id];
    if (chapter.map.finalNodeId === node.id) chapter.map.finalNodeId = chapter.map.nodes[chapter.map.nodes.length - 1].id;
    state.selectedNodeId = chapter.map.nodes[0].id;
    renderAll();
  }

  function addNodeReward() {
    const node = currentNode();
    if (!node) return;
    node.rewards = normalizeOptionalNodeRewards(node.rewards, defaultMatchRewardAmount(currentChapter()));
    node.rewards.push(createNodeRewardTemplate(defaultMatchRewardAmount(currentChapter())));
    renderAll();
  }

  function deleteNodeReward(index) {
    const node = currentNode();
    if (!node?.rewards) return;
    node.rewards.splice(index, 1);
    renderAll();
  }

  function updateNodeReward(input) {
    const node = currentNode();
    const reward = node?.rewards?.[Number(input.dataset.nodeRewardRow)];
    if (!reward) return;
    const key = input.dataset.nodeRewardField;
    reward[key] = key === 'type' ? input.value : toInt(input.value);
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function addTeamTemplate() {
    currentEvent().selectableTeamTemplates.push(createTeamTemplate());
    renderAll();
  }

  function deleteTeamTemplate(index) {
    currentEvent().selectableTeamTemplates.splice(index, 1);
    renderAll();
  }

  function updateTeamTemplate(input) {
    const team = currentEvent().selectableTeamTemplates[Number(input.dataset.teamRow)];
    if (!team) return;
    const key = input.dataset.teamField;
    if (key === 'templateTeamId') team[key] = toInt(input.value, -1);
    else if (key === 'teamNameId') team[key] = String(input.value || '').trim();
    else if (key === 'minAbility' || key === 'maxAbility') {
      team.replacementPlayerAbilityRange = normalizeAbilityRange(team.replacementPlayerAbilityRange);
      team.replacementPlayerAbilityRange[key] = toInt(input.value, key === 'minAbility' ? DEFAULT_REPLACEMENT_PLAYER_ABILITY_RANGE.minAbility : DEFAULT_REPLACEMENT_PLAYER_ABILITY_RANGE.maxAbility);
    }
    else if (key === 'formationRoles') team[key] = parseRoleList(input.value);
    else if (key === 'playerPoolIds') team[key] = parseIntList(input.value);
    renderSummary();
    renderJsonTab();
    renderValidation();
  }

  function addReward() {
    currentChapter().chapterRewards.push(createEventRewardTemplate('Point', 1, false));
    renderAll();
  }

  function deleteReward(index) {
    currentChapter().chapterRewards.splice(index, 1);
    renderAll();
  }

  function updateReward(input) {
    const reward = currentChapter().chapterRewards[Number(input.dataset.rewardRow)];
    const key = input.dataset.rewardField;
    if (key === 'firstClearOnly') reward[key] = input.value === 'true';
    else if (key === 'type') reward[key] = input.value;
    else reward[key] = toInt(input.value);
    renderAll();
  }

  function addLoopCompletionRewardGroup() {
    currentEvent().allChapterCompletionRewards.push(createLoopCompletionRewardGroupTemplate());
    renderAll();
  }

  function deleteLoopCompletionRewardGroup(index) {
    currentEvent().allChapterCompletionRewards.splice(index, 1);
    renderAll();
  }

  function addLoopCompletionReward(groupIndex) {
    const group = currentEvent().allChapterCompletionRewards[groupIndex];
    if (!group) return;
    group.rewards.push(createEventRewardTemplate('Point', 1, false));
    renderAll();
  }

  function deleteLoopCompletionReward(groupIndex, rewardIndex) {
    const group = currentEvent().allChapterCompletionRewards[groupIndex];
    if (!group) return;
    group.rewards.splice(rewardIndex, 1);
    renderAll();
  }

  function updateLoopCompletionRewardGroup(input) {
    const group = currentEvent().allChapterCompletionRewards[Number(input.dataset.loopGroupRow)];
    if (!group) return;
    const key = input.dataset.loopGroupField;
    group[key] = Math.max(1, toInt(input.value, 1));
    renderAll();
  }

  function updateLoopCompletionReward(input) {
    const group = currentEvent().allChapterCompletionRewards[Number(input.dataset.loopRewardGroup)];
    const reward = group?.rewards?.[Number(input.dataset.loopRewardRow)];
    if (!reward) return;
    const key = input.dataset.loopRewardField;
    if (key === 'firstClearOnly') reward[key] = input.value === 'true';
    else if (key === 'type') reward[key] = input.value;
    else reward[key] = toInt(input.value);
    renderAll();
  }

  function selectedRuleName() {
    return $('ruleSelect')?.value || Object.keys(currentEvent().randomEventRules || {})[0] || '';
  }

  function addRule() {
    const event = currentEvent();
    let index = Object.keys(event.randomEventRules).length + 1;
    let name = `Type${index}`;
    while (event.randomEventRules[name]) name = `Type${++index}`;
    event.randomEventRules[name] = { fatigueRange: [-2, 2], weights: [{ fatigueValue: -1, weight: 50 }, { fatigueValue: 1, weight: 50 }] };
    state.ruleName = name;
    renderAll();
  }

  function deleteRule() {
    const event = currentEvent();
    const name = selectedRuleName();
    if (!name) return;
    delete event.randomEventRules[name];
    state.ruleName = Object.keys(event.randomEventRules)[0] || '';
    renderAll();
  }

  function renameRule(newName) {
    const event = currentEvent();
    const oldName = selectedRuleName();
    if (!newName || !oldName || newName === oldName) return;
    if (event.randomEventRules[newName]) { setStatus(`规则 ${newName} 已存在`, 'bad'); return; }
    event.randomEventRules[newName] = event.randomEventRules[oldName];
    delete event.randomEventRules[oldName];
    event.chapters.forEach((chapter) => chapter.map.nodes.forEach((node) => { if (node.randomEventType === oldName) node.randomEventType = newName; }));
    state.ruleName = newName;
    renderAll();
  }

  function updateRuleRange() {
    const rule = currentEvent().randomEventRules[selectedRuleName()];
    if (!rule) return;
    rule.fatigueRange = [toInt($('ruleMinInput').value), toInt($('ruleMaxInput').value)];
    renderAll();
  }

  function addRuleRow() {
    const rule = currentEvent().randomEventRules[selectedRuleName()];
    if (!rule) return;
    rule.weights.push({ fatigueValue: 0, weight: 1 });
    renderAll();
  }

  function deleteRuleRow(index) {
    const rule = currentEvent().randomEventRules[selectedRuleName()];
    if (!rule) return;
    rule.weights.splice(index, 1);
    renderAll();
  }

  function updateRuleRow(input) {
    const rule = currentEvent().randomEventRules[selectedRuleName()];
    const row = rule?.weights?.[Number(input.dataset.ruleRow)];
    if (!row) return;
    row[input.dataset.ruleField] = toInt(input.value);
    renderAll();
  }

  function updateTextGroup(input) {
    currentEvent().randomEventTextGroups[input.dataset.textGroup] = parseStringList(input.value);
    renderAll();
  }

  function applyRawJson() {
    const raw = $('rawJson')?.value || '';
    loadConfigText(raw, '编辑区 JSON');
  }

  wireEvents();
  loadInitialConfig();
})();
</script>
</body>
</html>
